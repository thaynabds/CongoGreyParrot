[project]
name = "congo-grey-parrot-reunioes"
version = "0.1.0"
description = "Braço separado do Project Congo Grey Parrot para transcrição e anotação de reuniões."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1.0"]
dev = ["pytest>=8.2"]

[project.scripts]
congo-reunioes = "congo_reunioes.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
