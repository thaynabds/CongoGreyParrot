name: Testes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        programa: [desktop, discord, reunioes]
    defaults:
      run:
        working-directory: congo-grey-parrot-${{ matrix.programa }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt para a janela sem tela
        if: matrix.programa == 'desktop'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - run: python -m pip install -e ".[mcp,dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen

  mcp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
      - name: Os quatro servidores MCP num só ambiente
        run: |
          python -m pip install -e "congo-grey-parrot-desktop[mcp,dev]" -e "congo-grey-parrot-reunioes" -e "congo-grey-parrot-discord"
          python -m pytest -q -p no:cacheprovider mcp/test_tools.py

  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check congo-grey-parrot-discord/foundry/congo-grey-parrot/scripts/module.js
      - run: python3 -c "import json; json.load(open('congo-grey-parrot-discord/foundry/congo-grey-parrot/module.json'))"
